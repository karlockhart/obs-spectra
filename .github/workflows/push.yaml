name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  # Not master: everything reaches it through a pull request, whose build
  # already compiled the merge result, so building it again on the merge
  # only repeats that. Version tags build the release (the version is
  # compiled in from the tag, so the PR's binaries can't be shipped).
  push:
    paths-ignore:
      - '**.md'
    branches:
      - 'release/**'
    tags:
      - '*'
permissions:
  contents: read
jobs:
  # Spectra CI only builds Windows x64 and releases it for version tags.
  build-project:
    name: Build 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read

  create-release:
    name: Create Release 🛫
    if: github.ref_type == 'tag'
    # Windows: signtool, the Artifact Signing dlib and Inno Setup only run there
    runs-on: windows-2025-vs2026
    needs: build-project
    # The Azure sign-in trusts this environment's OIDC token (subject
    # repo:karlockhart/obs-spectra:environment:release), whatever the tag is
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        shell: pwsh
    env:
      # Signing is on once the repository has the Azure variables (README: Releases)
      SIGN: ${{ vars.AZURE_CLIENT_ID != '' }}
      SPECTRA_SIGNING_ENDPOINT: ${{ vars.SPECTRA_SIGNING_ENDPOINT }}
      SPECTRA_SIGNING_ACCOUNT: ${{ vars.SPECTRA_SIGNING_ACCOUNT }}
      SPECTRA_SIGNING_PROFILE: ${{ vars.SPECTRA_SIGNING_PROFILE }}
    steps:
      - name: Check Release Tag ☑️
        id: check
        shell: bash
        run: |
          : Check Release Tag ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          # 32.2.1, 32.2.1-spectra.1, 32.2.1-spectra.1-rc.1, 32.2.1-beta2, ...
          if [[ "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-spectra\.[0-9]+)?(-(beta|rc)\.?[0-9]+)?$ ]]; then
            echo 'validTag=true' >> $GITHUB_OUTPUT
            if [[ -n "${BASH_REMATCH[2]}" ]]; then
              echo 'prerelease=true' >> $GITHUB_OUTPUT
            else
              echo 'prerelease=false' >> $GITHUB_OUTPUT
            fi
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo 'validTag=false' >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: fromJSON(steps.check.outputs.validTag)
        with:
          path: repo
          sparse-checkout: |
            .github/scripts
            frontend/spectra-installer
            frontend/cmake/windows

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: fromJSON(steps.check.outputs.validTag)
        with:
          pattern: obs-studio-windows-x64-*
          merge-multiple: true
          path: full

      - name: Download Lite Build Artifacts 📥
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: fromJSON(steps.check.outputs.validTag)
        with:
          pattern: obs-studio-lite-windows-x64-*
          merge-multiple: true
          path: lite

      - name: Download Ultralight Build Artifacts 📥
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: fromJSON(steps.check.outputs.validTag)
        with:
          pattern: obs-studio-ultralight-windows-x64-*
          merge-multiple: true
          path: ultralight

      - name: Sign In to Azure 🔑
        if: fromJSON(steps.check.outputs.validTag) && env.SIGN == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # the identity may only sign with the certificate profile: it sees no subscription
          allow-no-subscriptions: true

      - name: Set Up Inno Setup and the VC++ Runtime 🧰
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Set Up Inno Setup and the VC++ Runtime 🧰
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup' }
          }
          # Microsoft's latest supported Visual C++ runtime, bundled for PCs without it
          Invoke-WebRequest -Uri 'https://aka.ms/vc14/vc_redist.x64.exe' -OutFile vc_redist.x64.exe -UseBasicParsing

      - name: Package Release 📦
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Package Release 📦
          # Every release ships OBS-Spectra, Lite and Ultralight, each as an
          # installed-style zip, a portable one and an installer; signed when
          # the Azure sign-in is set up
          $version = '${{ steps.check.outputs.version }}'
          $sign = $env:SIGN -eq 'true'
          foreach ($edition in @(
              @{ Name = 'Full'; Dir = 'full' },
              @{ Name = 'Lite'; Dir = 'lite' },
              @{ Name = 'Ultralight'; Dir = 'ultralight' })) {
            $zip = Get-ChildItem -Path $edition.Dir -Filter 'obs-studio-*-windows-x64.zip' | Select-Object -First 1
            if (-not $zip) { throw "No $($edition.Name) build" }
            ./repo/.github/scripts/Package-Spectra-Windows.ps1 -Build $zip.FullName -Edition $edition.Name `
              -Version $version -OutputDir release -Redist vc_redist.x64.exe -Sign:$sign
          }

      - name: Generate Checksums 🪪
        if: fromJSON(steps.check.outputs.validTag)
        shell: bash
        run: |
          : Generate Checksums 🪪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          cd release
          echo "### Checksums" > ../CHECKSUMS.txt
          for file in *.zip *-Setup.exe; do
            sha256sum "${file}" > "${file}.sha256"
            echo "    ${file}: $(cut -d " " -f 1 "${file}.sha256")" >> ../CHECKSUMS.txt
          done
          if [[ "${SIGN}" != 'true' ]]; then
            printf '\nThese builds are not code signed.\n' >> ../CHECKSUMS.txt
          fi

      - name: Create Release 🛫
        if: fromJSON(steps.check.outputs.validTag)
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          draft: false
          prerelease: ${{ fromJSON(steps.check.outputs.prerelease) }}
          tag_name: ${{ steps.check.outputs.version }}
          name: OBS-Spectra ${{ steps.check.outputs.version }}
          body_path: ${{ github.workspace }}/CHECKSUMS.txt
          fail_on_unmatched_files: true
          files: |
            release/*.zip
            release/*.zip.sha256
            release/*-Setup.exe
            release/*-Setup.exe.sha256
