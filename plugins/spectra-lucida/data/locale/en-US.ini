Lucida.Settings.CloudCredentials.Found="Using %1"
Lucida.Settings.CloudCredentials.None="No prisma-*.json found next to the log, in Spectra's Lucida folder or in %APPDATA%\Lucida. Make one with Mint credentials in the Prisma panel."
