Lucida.Settings.Storage.Note="A storage PC keeps paired PCs' loop recordings and chat logs. The PC that records sends each finished loop segment, its chat lines and its screenshots as they come, and keeps its own loop as a buffer (its quota in the loop recording settings can then be small). The storage PC keeps each PC's recordings in a folder of its own and deletes the oldest segments, whichever PC recorded them, to stay under its quota, just as the loop recording does; the logs keep lines and screenshots as long as this PC's own log does."
