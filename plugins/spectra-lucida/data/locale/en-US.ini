Lucida.Settings.CloudFrames.Tip="About 0.5 MB each; without this only lines and sessions are backed up"
Lucida.Settings.CloudTest="Test connection"
Lucida.Settings.CloudTesting="Connecting..."
Lucida.Settings.CloudConnected="Connected to %1 as \"%2\""
Lucida.Settings.CloudFailed="Could not connect: %1"
Lucida.Settings.CloudView.Note="The Cloud checkbox in the chat log browser shows your other installs' lines alongside this PC's."
Lucida.Settings.Network="Network"
Lucida.Settings.LanEnabled="Share with paired Spectra PCs on this network"
Lucida.Settings.Lan.Note="Spectra PCs on the same network find each other. Once two are paired (both people compare a six-digit code), each can search the other's chat log with its screenshots and download clips from its clips folder, read-only, for as long as Spectra runs on it. Nothing is copied in the background unless you choose a storage PC below, and unpaired PCs only see this PC's name. Connections are encrypted. Paired PCs remember where the others are and tell each other when one moves, so a PC whose address changes finds its way back."
Lucida.Settings.LanName="Name"
Lucida.Settings.LanKey="This PC's key"
Lucida.Settings.LanKey.None="made the first time sharing is turned on"
Lucida.Settings.LanPaired="Paired PCs"
Lucida.Settings.LanPaired.None="None yet: pair from the Chat Log dock"
Lucida.Settings.Lan.Firewall="Windows may ask whether OBS-Spectra may use the network: allow it. If Windows calls your home network \"Public\", allow it on public networks too (or make the network private in Windows' network settings), or the other PCs cannot reach this one. Spectra uses UDP port 47650 to find other PCs and TCP port 47651 (or another free one) for everything else. Some routers keep Wi-Fi devices apart (\"client isolation\", common on guest networks): then no PC can reach another and it has to be turned off in the router."
