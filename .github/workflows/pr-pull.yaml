name: Pull
run-name: ${{ github.event.pull_request.title }} pull request run 🚀
on:
  workflow_dispatch:
    inputs:
      editions:
        description: 'Editions to build: "full", or "all" for Lite and Ultralight too'
        type: choice
        options: [full, all]
        default: full
  pull_request:
    # nothing to build when only documentation changed
    paths-ignore:
      - '**.md'
      - '**.rst'
      - 'docs/**'
      - 'AUTHORS'
      - '.github/ISSUE_TEMPLATE/**'
    branches: [master, 'feature/**']
    types: [ opened, synchronize, reopened ]
permissions:
  contents: read
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true
jobs:
  # Spectra CI only builds Windows x64; the other upstream jobs are removed.
  build-project:
    name: Build 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    with:
      editions: ${{ inputs.editions }}
    permissions:
      contents: read
