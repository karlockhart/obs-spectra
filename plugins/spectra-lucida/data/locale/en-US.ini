Lucida.Settings.CloudEnabled="Back up the log to the cloud (Prisma)"
Lucida.Settings.Cloud.Note="Lines, sessions and screenshots are sent to your Prisma gateway in the background and kept there as a backup your other installs can search. The log on this PC stays the original: deleting or pruning it deletes nothing in the cloud."
Lucida.Settings.CloudCredentials="Credentials"
